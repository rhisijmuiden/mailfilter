# Managed by Mailfilter. Local resolver: blocklists like Spamhaus refuse
# queries that come through public resolvers such as 8.8.8.8.
server:
    interface: 127.0.0.1
    interface: ::1
    access-control: 127.0.0.0/8 allow
    access-control: ::1/128 allow
    do-ip6: yes
    prefetch: yes
    qname-minimisation: yes
    hide-identity: yes
    hide-version: yes
