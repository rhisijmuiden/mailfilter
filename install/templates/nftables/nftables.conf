#!/usr/sbin/nft -f
# Managed by Mailfilter (Security > Firewall). IPv4 and IPv6.
# Only replace our own table, so tables of others (such as the CrowdSec bouncer) survive a reload.
table inet mailfilter
delete table inet mailfilter

table inet mailfilter {
  set mgmt_v4 { type ipv4_addr; flags interval; {{MGMT_V4_ELEMENTS}} }
  set mgmt_v6 { type ipv6_addr; flags interval; {{MGMT_V6_ELEMENTS}} }
  # Extra relay ports, filled by mailfilter-config (relay_ports.nft below)
  set relay_ports { type inet_service; }

  chain input {
    type filter hook input priority filter; policy drop;

    ct state established,related accept
    ct state invalid drop
    iif "lo" accept

    # ICMP and ICMPv6 (IPv6 does not work without neighbour discovery)
    meta l4proto icmp icmp type { echo-request, destination-unreachable, time-exceeded, parameter-problem } limit rate 20/second accept
    meta l4proto ipv6-icmp accept

    # Mail
    tcp dport 25 accept comment "Inbound mail"
    tcp dport { 587, 465 } accept comment "Outbound relay"
    tcp dport @relay_ports accept comment "Extra relay ports"

    # Web interface (and Let's Encrypt when directly on the internet); see --web-mode
{{WEB_RULES}}

    # Remote management
{{SSH_RULES}}

    limit rate 5/minute log prefix "mailfilter-drop: " level info
  }

  chain forward {
    type filter hook forward priority filter; policy drop;
  }

  chain output {
    type filter hook output priority filter; policy accept;
  }
}

include "/etc/mailfilter/nftables/relay_ports.nft"
