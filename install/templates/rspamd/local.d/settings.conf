# Managed by Mailfilter. Throttling only applies to outbound mail:
# relay servers ("local") and SMTP accounts ("authenticated").
mf_outbound_authenticated {
  priority = high;
  authenticated = yes;
  apply { }
}
mf_outbound_relay {
  priority = high;
  local = yes;
  apply { }
}
mf_inbound {
  priority = low;
  ip = ["0.0.0.0/0", "::/0"];
  apply {
    symbols_disabled = ["RATELIMIT_CHECK"];
  }
}
