# Managed by Mailfilter (Throttling). Per-domain and per-server limits are
# written to ratelimit_overrides.conf by the web app.
rates {
  # Outbound per sending server (relay IP)
  mf_relay_ip_minute = { selector = "ip"; bucket = { burst = 30; rate = "30 / 1min"; } }
  mf_relay_ip_hour   = { selector = "ip"; bucket = { burst = 1000; rate = "1000 / 1h"; } }
  # Outbound per sender domain
  mf_from_domain_hour = { selector = "from('smtp'):domain"; bucket = { burst = 1000; rate = "1000 / 1h"; } }
  mf_from_domain_day  = { selector = "from('smtp'):domain"; bucket = { burst = 8000; rate = "8000 / 1d"; } }
  # Backscatter: limit bounces (empty sender) that relay servers send out
  bounce_to = { bucket = { burst = 5; rate = "1 / 5m"; } }
  bounce_to_ip = { bucket = { burst = 5; rate = "1 / 5m"; } }
  # Per SMTP account
  mf_user_hour = { selector = "user"; bucket = { burst = 500; rate = "500 / 1h"; } }
}
.include(try=true,priority=5) "/etc/mailfilter/rspamd/ratelimit_overrides.conf"
