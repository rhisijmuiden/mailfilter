# Managed by Mailfilter. Viruses and risky attachments go to quarantine.
rules {
  VIRUS_QUARANTINE {
    action = "quarantine";
    expression = "CLAM_VIRUS";
    message = "Virus found";
  }
  ATTACHMENT_QUARANTINE {
    action = "quarantine";
    expression = "MF_BAD_ATTACHMENT";
    message = "Blocked attachment";
  }
}
