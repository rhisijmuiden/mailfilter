# Managed by Mailfilter.
clamav {
  type = "clamav";
  servers = "/run/clamav/clamd.ctl";
  symbol = "CLAM_VIRUS";
  scan_mime_parts = true;
  scan_text_mime = false;
  scan_image_mime = false;
  max_size = 52428800;
  log_clean = true;
  patterns {
    JUST_EICAR = '^Eicar-Test-Signature$';
  }
  whitelist = "/etc/mailfilter/rspamd/antivirus_skip.map";
}
