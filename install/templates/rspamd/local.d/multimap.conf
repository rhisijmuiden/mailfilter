# Managed by Mailfilter (Filter rules > Allow and block lists).
MF_ALLOW_FROM {
  type = "from";
  filter = "email:addr";
  map = "/etc/mailfilter/rspamd/allow_from.map";
  regexp = false;
  score = -20.0;
  description = "Sender on the allow list";
}
MF_ALLOW_FROM_DOMAIN {
  type = "from";
  filter = "email:domain";
  map = "/etc/mailfilter/rspamd/allow_domain.map";
  score = -20.0;
  description = "Sender domain on the allow list";
}
MF_ALLOW_IP {
  type = "ip";
  map = "/etc/mailfilter/rspamd/allow_ip.map";
  score = -20.0;
  description = "Sending IP on the allow list";
}
MF_ALLOW_FROM_RE {
  type = "from";
  filter = "email:addr";
  map = "/etc/mailfilter/rspamd/allow_from_re.map";
  regexp = true;
  score = -20.0;
  description = "Sender matches an allow list pattern";
}
MF_BLOCK_FROM {
  type = "from";
  filter = "email:addr";
  map = "/etc/mailfilter/rspamd/block_from.map";
  action = "reject";
  description = "Sender on the block list";
}
MF_BLOCK_FROM_DOMAIN {
  type = "from";
  filter = "email:domain";
  map = "/etc/mailfilter/rspamd/block_domain.map";
  action = "reject";
  description = "Sender domain on the block list";
}
MF_BLOCK_IP {
  type = "ip";
  map = "/etc/mailfilter/rspamd/block_ip.map";
  action = "reject";
  description = "Sending IP on the block list";
}
MF_BLOCK_FROM_RE {
  type = "from";
  filter = "email:addr";
  map = "/etc/mailfilter/rspamd/block_from_re.map";
  regexp = true;
  action = "reject";
  description = "Sender matches a block list pattern";
}
