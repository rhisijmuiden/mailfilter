# Managed by Mailfilter (Filter rules > Allow and block lists).
MF_ALLOW_FROM {
  type = "from";
  filter = "email:addr";
  map = "/etc/mailfilter/rspamd/allow_from.map";
  regexp = false;
  score = -20.0;
  description = "Sender on the allow list";
}
MF_ALLOW_FROM_DOMAIN {
  type = "from";
  filter = "email:domain";
  map = "/etc/mailfilter/rspamd/allow_domain.map";
  score = -20.0;
  description = "Sender domain on the allow list";
}
MF_ALLOW_IP {
  type = "ip";
  map = "/etc/mailfilter/rspamd/allow_ip.map";
  score = -20.0;
  description = "Sending IP on the allow list";
}
MF_ALLOW_FROM_RE {
  type = "from";
  filter = "email:addr";
  map = "/etc/mailfilter/rspamd/allow_from_re.map";
  regexp = true;
  score = -20.0;
  description = "Sender matches an allow list pattern";
}
MF_BLOCK_FROM {
  type = "from";
  filter = "email:addr";
  map = "/etc/mailfilter/rspamd/block_from.map";
  action = "reject";
  description = "Sender on the block list";
}
MF_BLOCK_FROM_DOMAIN {
  type = "from";
  filter = "email:domain";
  map = "/etc/mailfilter/rspamd/block_domain.map";
  action = "reject";
  description = "Sender domain on the block list";
}
MF_BLOCK_IP {
  type = "ip";
  map = "/etc/mailfilter/rspamd/block_ip.map";
  action = "reject";
  description = "Sending IP on the block list";
}
MF_BLOCK_FROM_RE {
  type = "from";
  filter = "email:addr";
  map = "/etc/mailfilter/rspamd/block_from_re.map";
  regexp = true;
  action = "reject";
  description = "Sender matches a block list pattern";
}

# Allow and block lists people manage in the web interface (Allow and block
# lists page, and the links in the daily quarantine report). The web app writes
# "<recipient>|<sender>" lines to /var/lib/mailfilter/lists/{allow,block}.map,
# where recipient is a mailbox, a domain or "*" and sender an address or a
# domain. Every combination below is looked up with the envelope addresses.

MF_LIST_ALLOW_MAILBOX_ADDR {
  type = "selector";
  selector = "rcpts('smtp'):addr.lower;from('smtp'):addr.lower";
  delimiter = "|";
  map = "/var/lib/mailfilter/lists/allow.map";
  score = -20.0;
  description = "Sender address on the allow list of the mailbox";
}
MF_LIST_ALLOW_MAILBOX_DOMAIN {
  type = "selector";
  selector = "rcpts('smtp'):addr.lower;from('smtp'):domain.lower";
  delimiter = "|";
  map = "/var/lib/mailfilter/lists/allow.map";
  score = -20.0;
  description = "Sender domain on the allow list of the mailbox";
}
MF_LIST_ALLOW_DOMAIN_ADDR {
  type = "selector";
  selector = "rcpts('smtp'):domain.lower;from('smtp'):addr.lower";
  delimiter = "|";
  map = "/var/lib/mailfilter/lists/allow.map";
  score = -20.0;
  description = "Sender address on the allow list of the domain";
}
MF_LIST_ALLOW_DOMAIN_DOMAIN {
  type = "selector";
  selector = "rcpts('smtp'):domain.lower;from('smtp'):domain.lower";
  delimiter = "|";
  map = "/var/lib/mailfilter/lists/allow.map";
  score = -20.0;
  description = "Sender domain on the allow list of the domain";
}
MF_LIST_ALLOW_ALL_ADDR {
  type = "selector";
  selector = "id('*');from('smtp'):addr.lower";
  delimiter = "|";
  map = "/var/lib/mailfilter/lists/allow.map";
  score = -20.0;
  description = "Sender address on the allow list for all domains";
}
MF_LIST_ALLOW_ALL_DOMAIN {
  type = "selector";
  selector = "id('*');from('smtp'):domain.lower";
  delimiter = "|";
  map = "/var/lib/mailfilter/lists/allow.map";
  score = -20.0;
  description = "Sender domain on the allow list for all domains";
}
MF_LIST_BLOCK_MAILBOX_ADDR {
  type = "selector";
  selector = "rcpts('smtp'):addr.lower;from('smtp'):addr.lower";
  delimiter = "|";
  map = "/var/lib/mailfilter/lists/block.map";
  action = "reject";
  message = "Rejected: the sender is on the recipient's block list";
  description = "Sender address on the block list of the mailbox";
}
