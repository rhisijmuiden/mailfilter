# Managed by Mailfilter (Configuration > Custom rules > ARC). Rewritten by mailfilter-config apply.
# Seals use the DKIM keys: the sending domain for outgoing mail, the recipient's domain for
# incoming mail. Seals of other servers are always checked.
enabled = true;
path = "/var/lib/rspamd/dkim/$domain.$selector.key";
selector_map = "/etc/mailfilter/rspamd/dkim_selectors.map";
sign_local = true;
sign_authenticated = true;
sign_inbound = false;
use_domain = "header";
use_domain_sign_local = "envelope";
use_domain_sign_inbound = "recipient";
use_esld = true;
allow_username_mismatch = true;
allow_hdrfrom_mismatch = true;
allow_envfrom_empty = true;
try_fallback = false;
whitelisted_signers_map = "/etc/mailfilter/rspamd/arc_trusted.map";
adjust_dmarc = true;
