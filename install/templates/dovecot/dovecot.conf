# Managed by Mailfilter. Dovecot is only used to check SMTP account passwords
# for Postfix (relay with authentication). It serves no mailboxes.
dovecot_config_version = 2.4.0
dovecot_storage_version = 2.4.0

protocols {
  imap = no
  pop3 = no
  lmtp = no
}
listen =
auth_mechanisms = plain login
# Postfix only offers AUTH after TLS (smtpd_tls_auth_only), so the socket itself is local.
auth_allow_cleartext = yes
log_path = syslog
syslog_facility = mail

passdb passwd-file {
  passwd_file_path = /etc/mailfilter/smtp-users
}

service auth {
  unix_listener /var/spool/postfix/private/auth {
    mode = 0660
    user = postfix
    group = postfix
  }
}
