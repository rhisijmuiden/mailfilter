# Managed by Mailfilter. Dovecot checks SMTP account passwords for Postfix
# (relay with authentication). It only serves mailboxes for the Mailtrap, and only
# when a Mailtrap mailbox allows IMAP: see the included file at the end.
dovecot_config_version = 2.4.0
dovecot_storage_version = 2.4.0

protocols {
  imap = no
  pop3 = no
  lmtp = no
}
# No protocols are enabled, so Dovecot opens no network ports (2.4 does not allow an empty "listen").
auth_mechanisms = plain login
# Postfix only offers AUTH after TLS (smtpd_tls_auth_only), so the socket itself is local.
auth_allow_cleartext = yes
log_path = syslog
syslog_facility = mail

passdb passwd-file {
  passwd_file_path = /etc/mailfilter/smtp-users
}

service auth {
  unix_listener /var/spool/postfix/private/auth {
    mode = 0660
    user = postfix
    group = postfix
  }
}

# Mailtrap IMAP (written by the web interface; empty when no mailbox allows IMAP)
!include_try /etc/mailfilter/dovecot-mailtrap.conf
