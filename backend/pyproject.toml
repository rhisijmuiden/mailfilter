[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mailfilter"
version = "1.0.0"
description = "RHIS Mailfilter: web app, mail trace log collector and import tools"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.1",
  "argon2-cffi>=23.1",
  "cryptography>=42",
  "httpx>=0.27",
  # DNS toolbox (mailfilter_dns)
  "dnspython>=2.6",
  # QR code for setting up two-factor login (pure Python)
  "segno>=1.6",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
mailfilter-admin = "mailfilter.cli:main"
mailfilter-dmarc-ingest = "mailfilter.dmarc.ingest:main"
mailfilter-trap-deliver = "mailfilter.mailtrap.deliver:main"
mailfilter-spam-report = "mailfilter.feedback.ingest:main"

[tool.setuptools.packages.find]
# mailfilter (web app) and the sibling packages mailfilter_tracer, _dns, _config, _pmg
include = ["mailfilter*"]

[tool.setuptools.package-data]
mailfilter = ["alembic.ini", "migrations/*.mako"]
mailfilter_config = ["rspamd/*.lua"]

[tool.pytest.ini_options]
# tests/ = log collector (runs with Debian's python3-psycopg),
# tests_web/ = web app API (python -m pytest tests_web).
pythonpath = ["."]
testpaths = ["tests"]
