[project]
name = "mailfilter-tracer"
version = "0.1.0"
description = "Mailfilter log collector: turns Postfix and Rspamd logs into the mail trace"
requires-python = ">=3.11"
dependencies = [
  "psycopg>=3.1",
  # DNS toolbox (mailfilter_dns)
  "dnspython>=2.6",
  "httpx>=0.27",
  "cryptography>=42",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
