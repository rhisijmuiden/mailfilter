name: CI
on:
  push:
    branches: [test, main]
  pull_request:
jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck installer
        run: shellcheck -x -P install install/install.sh install/lib/common.sh install/templates/certbot/deploy-hook.sh
      - name: Bash syntax
        run: bash -n install/install.sh
  prototype:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prototype is built from its source
        run: |
          python3 prototype/build.py
          git diff --exit-code prototype/index.html
