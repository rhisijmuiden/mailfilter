name: CI
on:
  push:
    branches: [test, main]
  pull_request:
jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck installer
        run: shellcheck -x -P install -P . install/install.sh install/lib/common.sh install/templates/certbot/deploy-hook.sh install/tests/validate-configs.sh
      - name: Bash syntax
        run: bash -n install/install.sh
  prototype:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prototype is built from its source
        run: |
          python3 prototype/build.py
          git diff --exit-code prototype/index.html
  configs:
    # Renders every template and checks it with the real Debian 13 tools
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
      # nft -c needs to talk to the kernel's netfilter, like on a real server
      options: --cap-add=NET_ADMIN
    steps:
      - uses: actions/checkout@v4
      - name: Validate Postfix, Rspamd, Dovecot, unbound, nftables and Caddy configs
        run: bash install/tests/validate-configs.sh
  gateway-config:
    # Domains, relay access and throttling: unit tests, then apply a sample
    # configuration with the real Debian 13 Postfix, Rspamd and nftables
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
      options: --cap-add=NET_ADMIN
    steps:
      - uses: actions/checkout@v4
      - name: Set up Postfix and Rspamd from the installer templates
        run: bash install/tests/validate-configs.sh
      - name: Apply a sample gateway configuration
        run: bash backend/mailfilter_config/tests/integration.sh
